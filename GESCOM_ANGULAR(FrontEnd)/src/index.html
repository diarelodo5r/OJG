<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <title>GESCOM - Application</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/images/logos/SCS-Icon.png">
  <link rel="shortcut icon" type="image/png" href="./assets/images/logos/SCS-Icon.png" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.6.2/dist/dotlottie-wc.js" type="module"></script>
  <script src="https://code.iconify.design/2/2.0.3/iconify.min.js"></script>
  <style>
    .goog-te-banner-frame.skiptranslate { display: none !important; }
    body { top: 0 !important; }
    .goog-logo-link, .goog-te-gadget span { display: none !important; }
    #google_translate_element { display: none; }
    /* Additional hardening to prevent any overlay from flashing */
    .goog-te-gadget { height: 0; overflow: hidden; }
    .VIpgJd-ZVi9od-l4eHX-hSRGPd, .VIpgJd-ZVi9od-ORHb-OEVmcd { display: none !important; }
    .skiptranslate iframe { visibility: hidden !important; }
    /* Nudge the floating Google Translate icon further left to keep it hidden */
    .VIpgJd-ZVi9od-aZ2wEe-wOHMyf-ti6hGc {
      -webkit-transition-delay: 0s !important;
      transition-delay: 0s !important;
      left: 50px !important;
      top: -14px !important;
    }
  </style>
</head>

<body class="mat-typography">
  <app-root>
    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #fff">
      <dotlottie-wc 
        src="https://lottie.host/55a27277-9617-4209-8e2b-71a72da19f06/6qTbw3zHSJ.lottie" 
        style="width: 300px; height: 300px; margin: 0 auto;" 
        speed="1" 
        autoplay 
        loop>
      </dotlottie-wc>
    </div>
  </app-root>
  <!-- Hidden Google Translate container -->
  <div id="google_translate_element"></div>
  <script>
    // Pre-set default translation to French to avoid initial banner and layout shift
    (function presetGoogleTranslate() {
      try {
        var lang = localStorage.getItem('app_lang') || 'fr';
        // Set cookie for both path and root to improve reliability
        var domain = location.hostname;
        var expires = new Date();
        expires.setFullYear(expires.getFullYear() + 1);
        var exp = '; expires=' + expires.toUTCString();
        document.cookie = 'googtrans=/fr/' + lang + exp + '; path=/';
        // Some environments require domain cookie (esp. with subdomains)
        if (domain && domain.indexOf('.') > -1) {
          document.cookie = 'googtrans=/fr/' + lang + exp + '; domain=' + domain + '; path=/';
        }
        // Keep also in localStorage as some GT builds read it
        localStorage.setItem('googtrans', '/fr/' + lang);
      } catch (e) { /* no-op */ }
    })();

    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'fr',
        includedLanguages: 'en,fr',
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>

</html>
